[pytest]
# Anchors pytest's rootdir at the repo root regardless of which directory
# `pytest`/`python -m pytest` is invoked from (backend/tests/test_api.py's
# own README says `cd backend && pytest -q tests`, which otherwise leaves
# rootdir/confcutdir at backend/ and silently skips the repo-root
# conftest.py). `pythonpath` puts the repo root on sys.path directly so
# `from backend.app.X import ...` (used by test_device_auth.py and
# test_ml_pipeline_e2e_regression.py) resolves no matter the cwd.
pythonpath = .
testpaths = backend/tests
