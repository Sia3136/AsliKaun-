services:
  - type: web
    name: aslikaun-backend
    runtime: python
    plan: free
    branch: backend
    buildCommand: pip install -r requirements.txt && npm install --prefix frontend && npm run build --prefix frontend && npm install --prefix frontend/mobile-app && npm run build --prefix frontend/mobile-app
    startCommand: python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
